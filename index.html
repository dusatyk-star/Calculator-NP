<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NP Expeditor Calc Pro</title>
    <link rel="icon" type="image/png" href="https://vsetut.pl/uploads/news/images/840_460/1449673418-novaposhta.png">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        :root { --np-red: #e30613; --np-dark: #231f20; --np-grey: #f2f2f2; }
        body { font-family: sans-serif; background-color: var(--np-grey); margin: 0; padding: 15px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-top: 8px solid var(--np-red); }
        h1 { text-align: center; color: var(--np-red); font-size: 18px; text-transform: uppercase; margin-bottom: 20px; }
        h2 { font-size: 14px; border-bottom: 2px solid var(--np-grey); padding-bottom: 5px; margin-top: 20px; text-transform: uppercase; }
        button { width: 100%; padding: 15px; background-color: var(--np-red); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .btn-scan { background-color: #2e7d32; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .stats-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 12px; }
        .stats-table th, .stats-table td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        .stats-table th { background: var(--np-grey); }
        .address-item { padding: 8px; border-bottom: 1px solid #eee; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Нова Пошта: Експедитор</h1>
    <button class="btn-scan" onclick="document.getElementById('scrFiles').click()">📸 АВТОВВЕДЕННЯ СКРІНШОТІВ</button>
    <input type="file" id="scrFiles" accept="image/*" multiple style="display:none" onchange="scanScreenshots(this)">

    <h2>📋 СТАТИСТИКА ЗА РІК</h2>
    <table class="stats-table">
        <thead><tr><th>Місяць</th><th>Адр</th><th>ЕН</th><th>кг</th><th>грн</th></tr></thead>
        <tbody id="stats-body"></tbody>
    </table>

    <h2>📍 АДРЕСИ ЗА ЗМІНУ</h2>
    <div id="addresses-log"></div>
    
    <input type="text" id="address-title" placeholder="Адреса (наприклад, Адреса 1)">
    <input type="number" id="weight" step="0.01" placeholder="Вага (кг)">
    <input type="number" id="en-count" placeholder="Кількість ЕН">
    <button onclick="addManualAddress()">ДОДАТИ ВРУЧНУ</button>
    <button style="background-color: var(--np-dark);" onclick="saveShift()">ЗБЕРЕГТИ ЗМІНУ</button>
</div>

<script>
    // Захист від битих даних
    let currentAddresses = [];
    try { currentAddresses = JSON.parse(localStorage.getItem('currentAddresses')) || []; } catch(e) { localStorage.removeItem('currentAddresses'); }
    
    let yearStats = {};
    try { yearStats = JSON.parse(localStorage.getItem('yearStats')) || {}; } catch(e) { localStorage.removeItem('yearStats'); }

    const BASE_STRIKE = 245; const TARIF_EN = 0.24;

    function calcCost(w, e) {
        let tAddr = w > 200 ? 16.5 : (w > 30 ? 16.5 : (w > 1 ? 7.5 : 5.5));
        let tW = w > 200 ? 0.06 : (w > 30 ? 0.11 : 0.03);
        return tAddr + (w * tW) + (e * TARIF_EN);
    }

    async function scanScreenshots(input) {
        for (let file of input.files) {
            const url = URL.createObjectURL(file);
            const { data: { text } } = await Tesseract.recognize(url, 'ukr+eng');
            URL.revokeObjectURL(url);
            
            let clean = text.replace(/Материнська[^\n]*/gi, '');
            let w = parseFloat((clean.match(/(?:Вага|Bara|вага)[^\d]*([\d.,]+)/i) || [0,0])[1].replace(',', '.'));
            let eMatch = clean.match(/(?:ЕН|EH|Е\s*Н|E\s*H)[^\d]{0,5}(\d{1,3})/i);
            let e = eMatch ? parseInt(eMatch[1].replace(/[єeе]/g, '6').replace(/[oо]/g, '0')) : 1;
            
            if (w > 0) currentAddresses.push({ title: `Адреса ${currentAddresses.length + 1}`, weight: w, enCount: e, cost: calcCost(w, e) });
        }
        updateUI();
    }

    function addManualAddress() {
        const w = parseFloat(document.getElementById('weight').value);
        const e = parseInt(document.getElementById('en-count').value) || 1;
        if (!isNaN(w)) {
            currentAddresses.push({ title: document.getElementById('address-title').value || `Адреса ${currentAddresses.length + 1}`, weight: w, enCount: e, cost: calcCost(w, e) });
            updateUI();
        }
    }

    function saveShift() {
        const now = new Date();
        const mKey = now.toLocaleString('uk-UA', { month: 'long', year: 'numeric' });
        if (!yearStats[mKey]) yearStats[mKey] = { w:0, e:0, a:0, money:BASE_STRIKE };
        currentAddresses.forEach(s => {
            yearStats[mKey].w += s.weight; yearStats[mKey].e += s.enCount;
            yearStats[mKey].a++; yearStats[mKey].money += s.cost;
        });
        localStorage.setItem('yearStats', JSON.stringify(yearStats));
        currentAddresses = []; updateUI(); alert("Зміну збережено!");
    }

    function updateUI() {
        localStorage.setItem('currentAddresses', JSON.stringify(currentAddresses));
        document.getElementById('addresses-log').innerHTML = currentAddresses.map(a => 
            `<div class="address-item">${a.title}: ${a.weight} кг | ${a.enCount} ЕН</div>`).join('');
        const tbody = document.getElementById('stats-body');
        tbody.innerHTML = Object.entries(yearStats).map(([m, r]) => 
            `<tr><td>${m}</td><td>${r.a}</td><td>${r.e}</td><td>${r.w.toFixed(0)}</td><td>${r.money.toFixed(0)}</td></tr>`).join('');
    }
    window.onload = updateUI;
</script>
</body>
</html>

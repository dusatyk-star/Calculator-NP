<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NP Expeditor Calc Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        :root { --np-red: #e30613; --np-dark: #231f20; --np-grey: #f2f2f2; }
        body { font-family: sans-serif; background-color: var(--np-grey); margin: 0; padding: 15px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-top: 8px solid var(--np-red); }
        h1 { text-align: center; color: var(--np-red); font-size: 20px; }
        h2 { font-size: 16px; border-bottom: 2px solid var(--np-grey); padding-bottom: 8px; margin-top: 20px; }
        button { width: 100%; padding: 15px; background-color: var(--np-red); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .btn-scan { background-color: #2e7d32; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .stats-box { background: #fff; padding: 15px; border-radius: 8px; margin-top: 20px; border: 1px solid #ddd; }
        .history-item { padding: 10px; border-bottom: 1px solid #eee; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Нова Пошта: Експедитор</h1>
    <button class="btn-scan" onclick="document.getElementById('scrFiles').click()">📸 АВТОВВЕДЕННЯ СКРІНШОТІВ</button>
    <input type="file" id="scrFiles" accept="image/*" multiple style="display:none" onchange="scanScreenshots(this)">
    <div id="ocr-status" style="display:none; text-align:center; padding:10px; background:#fff3cd;">⏳ Обробка...</div>

    <input type="number" id="weight" placeholder="Вага (кг)">
    <input type="number" id="en-count" placeholder="Кількість ЕН">
    <button onclick="addAddress()">ДОДАТИ АДРЕСУ</button>

    <h2>📋 Статистика місяців:</h2>
    <div id="stats-log"></div>
    <button style="background-color: var(--np-dark);" onclick="clearHistory()">ОЧИСТИТИ ІСТОРІЮ</button>
</div>

<script>
    let shiftData = JSON.parse(localStorage.getItem('shiftData')) || [];
    const BASE_STRIKE = 245; 
    const TARIF_EN = 0.24;

    function calculateCost(w, e) {
        let tAddr = w > 200 ? 16.5 : (w > 30 ? 16.5 : (w > 1 ? 7.5 : 5.5));
        let tW = w > 200 ? 0.06 : (w > 30 ? 0.11 : 0.03);
        return tAddr + (w * tW) + (e * TARIF_EN);
    }

    async function scanScreenshots(input) {
        const files = input.files;
        let totalW = 0, totalE = 0, totalCost = 0, totalA = 0;
        
        for (let file of files) {
            const imgUrl = URL.createObjectURL(file);
            const { data: { text } } = await Tesseract.recognize(imgUrl, 'ukr+eng');
            URL.revokeObjectURL(imgUrl);
            
            let wMatch = text.match(/(?:Вага|Bara|вага)[^\d]*([\d.,]+)/i);
            let w = wMatch ? parseFloat(wMatch[1].replace(',', '.')) : 0;
            let eMatch = text.match(/(?:ЕН|EH|Е\s*Н|E\s*H)[^\d]{0,5}(\d{1,3})/i);
            let e = eMatch ? parseInt(eMatch[1]) : 1;
            
            if (w > 0) {
                totalW += w; totalE += e; totalA++;
                totalCost += calculateCost(w, e);
            }
        }
        
        saveToStats(totalA, totalE, totalW, totalCost + BASE_STRIKE);
        alert("Дані додано до статистики!");
    }

    function addAddress() {
        const w = parseFloat(document.getElementById('weight').value);
        const e = parseInt(document.getElementById('en-count').value) || 1;
        if (!isNaN(w)) {
            saveToStats(1, e, w, calculateCost(w, e));
            alert("Адресу додано!");
        }
    }

    function saveToStats(a, e, w, money) {
        const date = new Date();
        const monthYear = `${date.getMonth()+1}.${date.getFullYear()}`;
        let record = shiftData.find(r => r.month === monthYear);
        
        if (record) {
            record.addresses += a; record.en += e; record.weight += w; record.earnings += money;
        } else {
            shiftData.push({ month: monthYear, addresses: a, en: e, weight: w, earnings: money });
        }
        localStorage.setItem('shiftData', JSON.stringify(shiftData));
        renderStats();
    }

    function renderStats() {
        const log = document.getElementById('stats-log');
        log.innerHTML = shiftData.map(r => `
            <div class="history-item">
                <b>Місяць: ${r.month}</b><br>
                Адреси: ${r.addresses} | ЕН: ${r.en} | Вага: ${r.weight.toFixed(1)} кг<br>
                Заробіток: ${r.earnings.toFixed(2)} грн
            </div>
        `).join('');
    }

    function clearHistory() { if(confirm("Видалити статистику?")) { localStorage.removeItem('shiftData'); shiftData = []; renderStats(); } }
    window.onload = renderStats;
</script>
</body>
</html>

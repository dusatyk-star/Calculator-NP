<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NP Expeditor Calc Pro</title>
    <link rel="icon" type="image/png" href="https://vsetut.pl/uploads/news/images/840_460/1449673418-novaposhta.png">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        :root { --np-red: #e30613; --np-dark: #231f20; --np-grey: #f2f2f2; }
        body { font-family: sans-serif; background-color: var(--np-grey); margin: 0; padding: 15px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-top: 8px solid var(--np-red); }
        h1 { text-align: center; color: var(--np-red); text-transform: uppercase; font-size: 20px; margin-bottom: 20px; }
        h2 { font-size: 16px; border-bottom: 2px solid var(--np-grey); padding-bottom: 5px; margin-top: 25px; text-transform: uppercase; }
        button { width: 100%; padding: 15px; background-color: var(--np-red); color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .btn-scan { background-color: #2e7d32; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .debug-box { text-align: center; font-size: 12px; margin-bottom: 20px; padding: 10px; background: #fff3cd; border-radius: 6px; }
        #ocr-status { display: none; padding: 10px; background: #d4edda; text-align: center; margin-bottom: 15px; border-radius: 6px; font-weight: bold;}
        .address-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 10px; border-bottom: 1px solid #eee; font-size: 14px; background: #fdfdfd; }
        .del-btn { color: white; background: red; border: none; border-radius: 4px; padding: 4px 10px; cursor: pointer; font-weight: bold; font-size: 12px; width: auto; margin: 0; }
        .total-box { text-align: center; margin-top: 15px; padding: 15px; background: #fffafa; border: 1px solid #ffcdd2; border-radius: 8px; }
        .total-box h3 { margin: 0; color: var(--np-red); font-size: 22px; }
        .history-item { background: #f9f9f9; border: 1px solid #ddd; padding: 12px; margin-bottom: 8px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Нова Пошта: Експедитор</h1>
    
    <button class="btn-scan" onclick="document.getElementById('scrFiles').click()">📸 АВТОВВЕДЕННЯ ЗІ СКРІНШОТІВ</button>
    <input type="file" id="scrFiles" accept="image/*" multiple style="display:none" onchange="scanScreenshots(this)">
    
    <label class="debug-box"><input type="checkbox" id="debug-mode"> 🛠 Режим діагностики</label>
    <div id="ocr-status">Очікування...</div>

    <h2>✍️ Додати адресу</h2>
    <input type="text" id="address-title" placeholder="Адреса (наприклад, Адреса 1)">
    <input type="number" id="weight" step="0.01" placeholder="Вага (кг)">
    <input type="number" id="en-count" placeholder="Кількість ЕН">
    <button onclick="addAddress()">ДОДАТИ ВРУЧНУ</button>
    
    <h2>📍 Поточна зміна</h2>
    <div id="addresses-log">
        <p style="text-align:center; color:#999; font-size:13px;">Немає доданих адрес</p>
    </div>

    <div class="total-box">
        <p style="margin: 0 0 5px 0; font-size: 12px; color: #666;">Підсумок за зміну (зі ставкою 245 грн):</p>
        <h3><span id="shift-total">245.00</span> грн</h3>
    </div>

    <button style="background-color: var(--np-dark); margin-top: 15px;" onclick="saveShift()">ЗБЕРЕГТИ ЗМІНУ В ІСТОРІЮ</button>

    <h2>📋 Історія збережених змін</h2>
    <div id="history-log">
        <p style="text-align:center; color:#999; font-size:13px;">Історія порожня</p>
    </div>
</div>

<script>
    let currentAddresses = [];
    // Завантажуємо історію змін з пам'яті телефону
    let shiftHistory = JSON.parse(localStorage.getItem('npShiftHistory')) || [];
    
    const BASE_STRIKE = 245; 
    const TARIF_EN = 0.24;

    // Твоя сітка тарифікації
    function calculateCost(weight, enCount) {
        let tAddr = 0, tW = 0;
        if (weight >= 0 && weight <= 1) { tAddr = 5.5;  tW = 0.03; }
        else if (weight > 1 && weight <= 30) { tAddr = 7.5;  tW = 0.03; }
        else if (weight > 30 && weight <= 200) { tAddr = 16.5; tW = 0.11; }
        else if (weight > 200) { tAddr = 16.5; tW = 0.06; }
        return tAddr + (weight * tW) + (enCount * TARIF_EN);
    }

    // Сканер скріншотів
    async function scanScreenshots(input) {
        const files = input.files;
        if (files.length === 0) return;
        const statusBox = document.getElementById('ocr-status');
        statusBox.style.display = 'block';
        statusBox.innerText = "⏳ Обробка...";

        for (let file of files) {
            const imgUrl = URL.createObjectURL(file);
            const { data: { text } } = await Tesseract.recognize(imgUrl, 'ukr+eng');
            URL.revokeObjectURL(imgUrl);

            if (document.getElementById('debug-mode').checked) alert(text);

            let cleanText = text.replace(/Материнська[^\n]*/gi, '');
            let weight = 0, enCount = 1;

            const wMatch = cleanText.match(/(?:Вага|Bara|вага)[^\d]*([\d.,]+)/i);
            if (wMatch) weight = parseFloat(wMatch[1].replace(',', '.'));

            // Виправляємо друкарки (є -> 6, о -> 0)
            let eMatch = cleanText.match(/(?:ЕН|EH|Е\s*Н|E\s*H)[^\d]{0,5}(\d{1,3})/i);
            if (eMatch) enCount = parseInt(eMatch[1].replace(/[єeе]/g, '6').replace(/[oо]/g, '0'));

            if (weight > 0) {
                const cost = calculateCost(weight, enCount);
                currentAddresses.push({ 
                    id: Date.now() + Math.random(), 
                    title: `Адреса ${currentAddresses.length + 1}`, 
                    weight, 
                    enCount, 
                    cost 
                });
            }
        }
        statusBox.innerText = "✅ Готово!";
        setTimeout(() => statusBox.style.display = 'none', 3000);
        renderCurrentShift();
    }

    // Ручне додавання
    function addAddress() {
        const t = document.getElementById('address-title').value || `Адреса ${currentAddresses.length + 1}`;
        const w = parseFloat(document.getElementById('weight').value);
        const e = parseInt(document.getElementById('en-count').value) || 1;
        if (!isNaN(w)) { 
            const cost = calculateCost(w, e);
            currentAddresses.push({ id: Date.now(), title: t, weight: w, enCount: e, cost }); 
            renderCurrentShift(); 
        }
    }

    // Видалення однієї адреси зі списку
    function deleteAddress(id) {
        currentAddresses = currentAddresses.filter(a => a.id !== id);
        renderCurrentShift();
    }

    // Відображення поточної зміни
    function renderCurrentShift() {
        const log = document.getElementById('addresses-log');
        let totalMoney = BASE_STRIKE;
        
        if (currentAddresses.length === 0) {
            log.innerHTML = '<p style="text-align:center; color:#999; font-size:13px;">Немає доданих адрес</p>';
            document.getElementById('shift-total').innerText = BASE_STRIKE.toFixed(2);
            return;
        }

        log.innerHTML = currentAddresses.map((a) => {
            totalMoney += a.cost;
            return `<div class="address-item">
                        <div style="flex-grow: 1;">
                            <b>${a.title}</b><br>
                            <span style="color:#666; font-size: 12px;">${a.weight} кг | ${a.enCount} ЕН | <strong style="color:var(--np-red)">+${a.cost.toFixed(2)} ₴</strong></span>
                        </div>
                        <button class="del-btn" onclick="deleteAddress(${a.id})">✕</button>
                    </div>`;
        }).join('');
        
        document.getElementById('shift-total').innerText = totalMoney.toFixed(2);
    }

    // Збереження зміни в історію
    function saveShift() { 
        if (currentAddresses.length === 0) {
            alert("Спочатку додайте адреси!");
            return;
        }

        let totalMoney = BASE_STRIKE;
        currentAddresses.forEach(a => totalMoney += a.cost);

        const now = new Date();
        const dateString = `${now.getDate()}.${now.getMonth()+1}.${now.getFullYear()} ${now.getHours()}:${now.getMinutes()}`;

        const newShift = {
            id: Date.now(),
            date: dateString,
            addressCount: currentAddresses.length,
            total: totalMoney
        };

        shiftHistory.unshift(newShift); // Додаємо на початок списку
        localStorage.setItem('npShiftHistory', JSON.stringify(shiftHistory));
        
        alert(`Зміну збережено!\nЗаробіток: ${totalMoney.toFixed(2)} грн`); 
        currentAddresses = []; 
        document.getElementById('address-title').value = '';
        document.getElementById('weight').value = '';
        document.getElementById('en-count').value = '';
        
        renderCurrentShift(); 
        renderHistory();
    }

    // Видалення збереженої зміни
    function deleteShift(id) {
        if (confirm("Точно видалити цю зміну з історії?")) {
            shiftHistory = shiftHistory.filter(s => s.id !== id);
            localStorage.setItem('npShiftHistory', JSON.stringify(shiftHistory));
            renderHistory();
        }
    }

    // Відображення історії змін
    function renderHistory() {
        const log = document.getElementById('history-log');
        if (shiftHistory.length === 0) {
            log.innerHTML = '<p style="text-align:center; color:#999; font-size:13px;">Історія порожня</p>';
            return;
        }

        log.innerHTML = shiftHistory.map(s => {
            return `<div class="history-item">
                        <div>
                            <b>🗓 ${s.date}</b><br>
                            <span style="color:#666; font-size: 12px;">Адрес: ${s.addressCount} | Заробіток: <strong style="color:var(--np-red)">${s.total.toFixed(2)} ₴</strong></span>
                        </div>
                        <button class="del-btn" onclick="deleteShift(${s.id})">Видалити</button>
                    </div>`;
        }).join('');
    }

    // Завантажуємо списки при відкритті сайту
    window.onload = function() {
        renderCurrentShift();
        renderHistory();
    };
</script>
</body>
</html>
